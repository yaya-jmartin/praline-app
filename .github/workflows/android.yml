# Builds Praliné with the official Android tools on GitHub's machines, runs every test and Android Lint,
# and keeps the APKs, test results, screenshots and lint report as downloadable artifacts.
# The release APK is signed with the "praline" key when the repository's secrets hold it (issue #5):
#   PRALINE_KEYSTORE_B64  the release.jks file, base64-encoded
#   PRALINE_KEY_PASSWORD  its password
# The signed APK is kept as the "praline-signed" artifact. Outside pull requests it is also committed to the
# "builds" branch as Praline-<version>.apk, so it can be fetched with git and dropped into the Praliné folder.
# Publishing a Release stays a manual step for Yaya.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the release key
        env:
          KEYSTORE_B64: ${{ secrets.PRALINE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PRALINE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the release APK stays unsigned."
          fi

      - name: Build, test and lint
        working-directory: agp
        env:
          PRALINE_KEY_PASSWORD: ${{ secrets.PRALINE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the signed APK
        if: env.PRALINE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: praline-signed
          path: agp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praline-build
          path: |
            agp/app/build/outputs/apk/
            agp/app/build/reports/
            agp/app/build/test-results/
            build/shots/
            agp/app/build/shots/
          if-no-files-found: warn
          retention-days: 14

  # A separate job holds the write permission, so the job that sees the signing key stays read-only.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the signed APK
        id: apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: praline-signed
          path: ${{ runner.temp }}/signed

      - name: Commit it to the builds branch
        if: steps.apk.outcome == 'success'
        run: |
          ver=$(grep -o 'versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)
          dir="$RUNNER_TEMP/builds"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin builds >/dev/null; then
            git fetch -q --depth=1 origin builds
            git worktree add -q "$dir" FETCH_HEAD
            git -C "$dir" checkout -q -B builds
          else
            git worktree add -q --detach "$dir"
            git -C "$dir" checkout -q --orphan builds
            git -C "$dir" rm -rq --cached . && find "$dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp "$RUNNER_TEMP/signed/app-release.apk" "$dir/Praline-$ver.apk"
          git -C "$dir" add "Praline-$ver.apk"
          git -C "$dir" commit -q -m "Praliné $ver signed APK (${GITHUB_SHA::7}, ${GITHUB_REF_NAME})" || { echo "Unchanged"; exit 0; }
          git -C "$dir" push -q origin builds
