# Builds Praliné with the official Android tools on GitHub's machines, runs every test and Android Lint,
# and keeps the APKs, test results, screenshots and lint report as downloadable artifacts.
# Nothing is signed with the release key or published here: that waits for Yaya's approval.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        working-directory: agp
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praline-build
          path: |
            agp/app/build/outputs/apk/
            agp/app/build/reports/
            agp/app/build/test-results/
            build/shots/
            agp/app/build/shots/
          if-no-files-found: warn
          retention-days: 14
